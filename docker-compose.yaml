services:
    live-clipper:
        build: .
        container_name: my-live-clipper
        restart: unless-stopped
        shm_size: "1gb"
        dns:
            - 8.8.8.8
            - 1.1.1.1
        security_opt:
            - no-new-privileges:true
        environment:
            - STREAM_URLS=https://www.twitch.tv/typicalgamer,https://www.twitch.tv/ishowspeed,https://www.twitch.tv/kaicenat,https://www.twitch.tv/ohnepixel,https://www.twitch.tv/xqc,https://www.twitch.tv/nickeh30
            - SCORE_THRESHOLD=70
            - WHISPER_MODEL=base.en
            - CLIP_PRE_SECONDS=30
            - CLIP_POST_SECONDS=0
            - BURN_SUBTITLES=true
            # Folder Auto-Upload Settings (watches /app/data/upload)
            - ENABLE_UPLOAD=true
            - UPLOAD_TIKTOK=true
            - UPLOAD_YOUTUBE=true
            - UPLOAD_INSTAGRAM=true
            - YT_PRIVACY=public
            - UPLOAD_MIN_MINUTES=25
            - UPLOAD_MAX_MINUTES=35
            - MIN_UPLOAD_INTERVAL_SEC=1800
        volumes:
            - ./data/clips:/app/data/clips
            - ./data/upload:/app/data/upload
            - ./data/auth:/app/data/auth
        tmpfs:
            - /app/data/buffer:size=2G
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]
